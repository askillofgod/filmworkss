<title>필름웍스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --sunk:#E3E9EC; --ink:#15212A; --muted:#5B6A74; --line:#D3DBE0;
  --accent:#1E4F6E; --accent-ink:#FFFFFF; --accent-soft:#DAE7EF;
  --head-bg:linear-gradient(135deg,#1E4F6E 0%,#163C55 100%); --head-ink:#FFFFFF; --head-muted:rgba(255,255,255,.68); --head-chip:rgba(255,255,255,.12); --head-line:rgba(255,255,255,.18);
  --due:#A95F0A; --due-soft:#F7E9D4; --ok:#2B7A4B; --ok-soft:#DFF0E5; --bad:#B23A36; --bad-soft:#F6E0DE;
  --shadow:0 1px 2px rgba(21,33,42,.06),0 6px 20px rgba(21,33,42,.06);
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --logo:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E151A; --surface:#162027; --sunk:#1C2831; --ink:#E4EBEF; --muted:#8E9EA9; --line:#26343D;
  --accent:#7DB4D6; --accent-ink:#0E151A; --accent-soft:#1B3242;
  --head-bg:linear-gradient(135deg,#17384D 0%,#112A3A 100%); --head-ink:#E9F2F8; --head-muted:rgba(233,242,248,.62); --head-chip:rgba(255,255,255,.08); --head-line:rgba(255,255,255,.12);
  --due:#E6A452; --due-soft:#3A2A16; --ok:#6CC592; --ok-soft:#163022; --bad:#EE8A84; --bad-soft:#3A1D1C;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E151A; --surface:#162027; --sunk:#1C2831; --ink:#E4EBEF; --muted:#8E9EA9; --line:#26343D;
  --accent:#7DB4D6; --accent-ink:#0E151A; --accent-soft:#1B3242;
  --head-bg:linear-gradient(135deg,#17384D 0%,#112A3A 100%); --head-ink:#E9F2F8; --head-muted:rgba(233,242,248,.62); --head-chip:rgba(255,255,255,.08); --head-line:rgba(255,255,255,.12);
  --due:#E6A452; --due-soft:#3A2A16; --ok:#6CC592; --ok-soft:#163022; --bad:#EE8A84; --bad-soft:#3A1D1C;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head-bg);color:var(--head-ink);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 14px;margin-inline:-16px;padding-inline:16px;box-shadow:0 2px 10px rgba(10,30,45,.18)}
.logo{font-family:var(--logo);font-size:21px;font-weight:700;letter-spacing:-.2px;line-height:1;display:flex;align-items:baseline;gap:8px}
.logo small{font-family:var(--sans);font-size:12px;color:var(--head-muted);letter-spacing:0;font-weight:500}
.monthnav{display:flex;align-items:center;gap:2px;background:var(--head-chip);border:1px solid var(--head-line);border-radius:999px;padding:2px}
.monthnav button{border:0;background:none;width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--head-muted)}
.monthnav span{font-weight:600;font-size:14px;min-width:92px;text-align:center}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--head-bg);box-shadow:0 -2px 10px rgba(10,30,45,.18);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{position:relative;border:0;background:none;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--head-muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--head-ink)}
nav.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--head-ink)}
nav.tabs .badge{font-family:var(--mono);font-size:10px;background:#E6A452;color:#1A1206;border-radius:8px;padding:0 5px;margin-left:2px}

section.view{display:flex;flex-direction:column;gap:14px;padding-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.3px}
h2{font-size:17px;margin:0;text-wrap:balance}

/* form */
.field{display:flex;flex-direction:column;gap:6px}
.form{display:flex;flex-direction:column;gap:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=text],input[type=date],input[type=search],input[inputmode],textarea,select{width:100%;background:var(--sunk);border:1px solid transparent;border-radius:10px;padding:11px 12px;font-size:16px;min-width:0}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);background:var(--surface)}
textarea{resize:vertical;min-height:44px}
.vin{font-family:var(--mono);letter-spacing:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;line-height:1.3}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.ghost{color:var(--muted);border-style:dashed}
.amount-wrap{display:flex;align-items:center;gap:10px}
.amount-wrap input{font-family:var(--mono);font-size:20px;font-weight:600;text-align:right}
.amount-wrap .unit{color:var(--muted);font-weight:600}
.hint{font-size:13px;color:var(--muted)}
.hint.warn{color:var(--due)}
.toggle{display:flex;gap:0;background:var(--sunk);border-radius:10px;padding:3px}
.toggle button{flex:1;border:0;background:none;border-radius:8px;padding:8px;font-weight:600;color:var(--muted)}
.toggle button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.toggle button[aria-pressed="true"].paid{color:var(--ok)}
.toggle button[aria-pressed="true"].due{color:var(--due)}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--sunk);color:var(--ink)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.5}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}

/* list */
.dayhead{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px;font-size:13px;color:var(--muted);font-weight:600}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.job{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.job:first-child{border-top:0}
.job .car{font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.job .car .mono{font-weight:500;font-size:13px;color:var(--muted)}
.job .sub{font-size:13px;color:var(--muted);grid-column:1}
.job .amt{font-family:var(--mono);font-weight:600;text-align:right;align-self:start}
.job .st{grid-column:2;justify-self:end}
.job.cancel .car,.job.cancel .amt{text-decoration:line-through;color:var(--muted)}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;border:0}
.pill.due{background:var(--due-soft);color:var(--due)}
.pill.paid{background:var(--ok-soft);color:var(--ok)}
.pill.cancel{background:var(--sunk);color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}

.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.summary b{font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.summary .due b{color:var(--due)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar input{flex:1;min-width:140px}

/* dues */
.bigdue{display:flex;flex-direction:column;gap:2px}
.bigdue b{font-family:var(--mono);font-size:32px;color:var(--due);line-height:1.1}
.shopdue{display:flex;flex-direction:column;gap:10px}
.shopdue .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;border:0;background:none;padding:0;text-align:left}
.shopdue .hd b{font-size:16px}
.shopdue .hd .num{font-weight:600;color:var(--due);font-size:17px}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.check .t{flex:1;min-width:0}
.check .num{font-weight:600}
.confirm{background:var(--due-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:14px}

/* stats */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:78px 1fr 84px;gap:10px;align-items:center;font-size:13px}
.bar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar .v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.chartwrap{overflow-x:auto}
svg.months text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
svg.months .lbl{fill:var(--ink);font-weight:600}
svg.months rect.b{fill:var(--accent);opacity:.35}
svg.months rect.b.sel{opacity:1}
svg.months rect.hit{fill:transparent;cursor:pointer}
svg.months line{stroke:var(--line)}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.x{border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;font-size:18px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:30;max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner{background:var(--due-soft);color:var(--due);border-radius:12px;padding:12px 14px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
</style>

<div class="app">
  <header class="top">
    <div class="logo">필름웍스 <small id="syncState">불러오는 중</small></div>
    <div class="monthnav" id="monthnav">
      <button id="mPrev" aria-label="이전 달">‹</button>
      <span id="mLabel"></span>
      <button id="mNext" aria-label="다음 달">›</button>
    </div>
  </header>
  <div id="banner"></div>
  <main id="main"></main>
</div>

<nav class="tabs" role="tablist">
  <button role="tab" data-tab="add" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>입력</button>
  <button role="tab" data-tab="book" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M9 9h6M9 13h6"/></svg>장부</button>
  <button role="tab" data-tab="due" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg><span>미수금<span class="badge" id="dueBadge" hidden></span></span></button>
  <button role="tab" data-tab="stats" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-7"/></svg>통계</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>
(() => {
const WORKS = ['유리막','프리미엄 유리막','썬팅','PPF','하이패스','가죽코팅','실내크리닝','블랙박스','크롬죽이기','광택'];
const QUICK = [7,8,9,10,15,20,25];
const pad = n => String(n).padStart(2,'0');
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const won = n => (n||0).toLocaleString('ko-KR');
const man = n => { n=n||0; const m=n/10000; return (Number.isInteger(m)? m.toLocaleString('ko-KR') : m.toFixed(1)) + '만'; };
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DOW = ['일','월','화','수','목','금','토'];
const dayLabel = ds => { const d=new Date(ds+'T00:00'); return `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`; };

const now = new Date();
const S = {
  tab: 'add', year: now.getFullYear(), month: now.getMonth()+1,
  jobs: [], loaded: false, sb: null,
  form: null, bookFilter: 'all', bookQuery: '', bookShop: '',
  openShop: null, dueSel: {}, confirm: null, statMonth: null,
};
try { const t = localStorage.getItem('cn.tab'); if (t) S.tab = t; } catch(e){}

function blankForm(keep){
  return { id:null, date: keep?.date || todayStr(), shop: keep?.shop||'', dealer: keep?.dealer||'', car:'', vin:'',
    works: keep?.works ? [...keep.works] : [], workExtra: keep?.workExtra||'', amount: keep?.amount ?? '', paid: keep?.paid||false, canceled:false, note:'' };
}
S.form = blankForm();

// ---------- data ----------
const ym = () => `${S.year}-${pad(S.month)}`;
const live = j => !j.canceled;
const monthJobs = () => S.jobs.filter(j => j.date.startsWith(ym()));
const sum = arr => arr.reduce((a,j)=>a+(live(j)?(j.amount||0):0),0);
function freq(key, filter){
  const c = new Map();
  for (const j of S.jobs) { if (filter && !filter(j)) continue; const v=(j[key]||'').trim(); if (v) c.set(v,(c.get(v)||0)+1); }
  return [...c.entries()].sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
}
function splitWork(w){ return (w||'').split(/[,/]/).map(s=>s.trim()).filter(Boolean); }
function joinWork(f){ return [...f.works, ...(f.workExtra.trim()?[f.workExtra.trim()]:[])].join(', '); }

// Supabase 'filmworks' 스키마 (다른 앱과 분리된 공간)
const SB_URL = 'https://qtiazentdzwzkgrsjbob.supabase.co';
const SB_KEY = 'sb_publishable_bKsdXn04F_MCXT9YgCiYZg_biJjPRZC';
const fromRow = r => ({ id:r.id, date:r.date, shop:r.shop, dealer:r.dealer, car:r.car, vin:r.vin, work:r.work,
  amount:r.amount, paid:r.paid, paidDate:r.paid_date||'', canceled:r.canceled, note:r.note, src:r.src });
function fail(e, what){
  console.error(e);
  const msg = String(e?.message||'');
  if (/schema must be one of|Invalid schema/i.test(msg)) showBanner('Supabase에서 filmworks 공간이 아직 열리지 않았어요. (Settings → API → Exposed schemas에 filmworks 추가)');
  else toast(`${what} 못했어요. 다시 시도해 주세요.`);
}

async function load(){
  if (!S.sb) return;
  setSync('불러오는 중');
  const { data, error } = await S.sb.from('jobs').select('*')
    .gte('date', `${S.year}-01-01`).lt('date', `${S.year+1}-01-01`)
    .order('date', { ascending:false }).order('created_at', { ascending:false }).limit(5000);
  if (error) { setSync('연결 끊김'); fail(error, '장부를 불러오지'); return; }
  showBanner('');
  S.jobs = data.map(fromRow);
  S.loaded = true; setSync(`${S.year}년 ${S.jobs.length}건`);
  // don't yank the keyboard away while someone is typing
  if (document.activeElement?.matches('#main input, #main textarea, #main select')) { S.stale = true; return; }
  render();
}
function setSync(t){ document.getElementById('syncState').textContent = t; }
function showBanner(t){ document.getElementById('banner').innerHTML = t ? `<div class="banner" style="margin-top:12px">${esc(t)}</div>` : ''; }

async function saveJob(f){
  const data = { date:f.date, shop:f.shop.trim(), dealer:f.dealer.trim(), car:f.car.trim(), vin:f.vin.trim(),
    work: joinWork(f), amount: Number(String(f.amount).replace(/[^\d]/g,''))||0, paid: !!f.paid, canceled: !!f.canceled,
    note: f.note.trim() };
  if (f.id) {
    const old = S.jobs.find(j=>j.id===f.id) || {};
    data.paid_date = data.paid ? (old.paid ? (old.paidDate||todayStr()) : todayStr()) : null;
    const { error } = await S.sb.from('jobs').update(data).eq('id', f.id);
    if (error) throw error;
  } else {
    data.paid_date = data.paid ? todayStr() : null;
    const { error } = await S.sb.from('jobs').insert(data);
    if (error) throw error;
  }
  load();
  return data;
}
async function deleteJob(id){
  const { error } = await S.sb.from('jobs').delete().eq('id', id);
  if (error) throw error;
  load();
}
async function setPaid(ids, paid){
  const upd = paid ? { paid:true, paid_date:todayStr() } : { paid:false, paid_date:null };
  const { error } = await S.sb.from('jobs').update(upd).in('id', ids);
  if (error) { fail(error, '입금 처리를'); return false; }
  await load();
  return true;
}

// ---------- ui helpers ----------
let toastT;
function toast(t){ document.querySelector('.toast')?.remove(); const el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el); clearTimeout(toastT); toastT=setTimeout(()=>el.remove(),2400); }
function chips(list, selected, attr, extraClass=''){
  return list.map(v=>`<button type="button" class="chip ${extraClass}" data-${attr}="${esc(v)}" aria-pressed="${Array.isArray(selected)?selected.includes(v):selected===v}">${esc(v)}</button>`).join('');
}
function statusPill(j){
  if (j.canceled) return `<span class="pill cancel">취소</span>`;
  return j.paid ? `<span class="pill paid">입금</span>` : `<span class="pill due">미입금</span>`;
}
function jobRow(j){
  const sub = [j.shop||'작업장 미기재', j.dealer, j.work].filter(Boolean).join(' · ');
  return `<button type="button" class="job ${j.canceled?'cancel':''}" data-edit="${esc(j.id)}">
    <span class="car">${esc(j.car||'차종 미기재')}${j.vin?`<span class="mono">${esc(j.vin)}</span>`:''}</span>
    <span class="amt">${won(j.amount)}</span>
    <span class="sub">${esc(sub)}${j.note?` — ${esc(j.note)}`:''}</span>
    <span class="st">${statusPill(j)}</span>
  </button>`;
}

// ---------- form ----------
function formHTML(f, mode){
  const shops = freq('shop').slice(0,8);
  const dealers = f.shop ? freq('dealer', j=>j.shop===f.shop).slice(0,8) : [];
  const cars = freq('car', f.shop ? j=>j.shop===f.shop : null).slice(0,10);
  const dup = f.vin.trim().length>=4 ? S.jobs.find(j=>j.vin===f.vin.trim() && j.id!==f.id) : null;
  const amt = Number(String(f.amount).replace(/[^\d]/g,''))||0;
  const sugg = suggestAmount(f);
  return `<form class="form" id="jobForm" autocomplete="off">
    <div class="field"><label class="label" for="f_date">작업일</label><input type="date" id="f_date" value="${esc(f.date)}" required></div>

function suggestAmount(f){
  const w = joinWork(f); if (!w && !f.shop) return 0;
  const hit = S.jobs.find(j => !j.canceled && j.amount && j.shop===f.shop && (w ? j.work===w : true) && (f.car ? j.car===f.car : true))
           || S.jobs.find(j => !j.canceled && j.amount && j.shop===f.shop && (w ? j.work===w : true));
  return hit ? hit.amount : 0;
}
function readForm(root, f){
  const g = id => root.querySelector('#'+id);
  f.date = g('f_date').value || f.date; f.shop = g('f_shop').value; f.dealer = g('f_dealer').value;
  f.car = g('f_car').value; f.vin = g('f_vin').value.replace(/\s/g,''); f.workExtra = g('f_workx').value;
  f.amount = g('f_amount').value.replace(/[^\d]/g,''); f.note = g('f_note').value;
  const c = g('f_cancel'); if (c) f.canceled = c.checked;
}
function bindForm(root, f, mode, rerender, done){
  root.onclick = async e => {
    const b = e.target.closest('button'); if (!b || !root.contains(b)) return;
    if (b.dataset.shop!==undefined){ readForm(root,f); f.shop = f.shop===b.dataset.shop?'':b.dataset.shop; f.dealer=''; rerender(); }
    else if (b.dataset.dealer!==undefined){ readForm(root,f); f.dealer=b.dataset.dealer; rerender(); }
    else if (b.dataset.car!==undefined){ readForm(root,f); f.car=b.dataset.car; rerender(); root.querySelector('#f_vin')?.focus(); }
    else if (b.dataset.work!==undefined){ readForm(root,f); const w=b.dataset.work; f.works = f.works.includes(w)? f.works.filter(x=>x!==w) : [...f.works,w]; if(!f.amount){const s=suggestAmount(f); if(s) f.amount=String(s);} rerender(); }
    else if (b.dataset.quick!==undefined){ readForm(root,f); f.amount = String(Number(b.dataset.quick)*10000); rerender(); }
    else if (b.dataset.paid!==undefined){ readForm(root,f); f.paid = b.dataset.paid==='1'; rerender(); }
    else if (b.id==='f_del'){
      root.querySelector('#delConfirm').innerHTML = `<div class="confirm"><span>이 작업을 장부에서 지울까요? 되돌릴 수 없어요.</span><div class="btnrow"><button type="button" class="btn small sec" data-delno>그대로 두기</button><button type="button" class="btn small danger" data-delyes>지우기</button></div></div>`;
    }
    else if (b.hasAttribute('data-delno')) root.querySelector('#delConfirm').innerHTML='';
    else if (b.hasAttribute('data-delyes')){ b.disabled=true; try{ await deleteJob(f.id); toast('지웠어요'); done(); }catch(err){ fail(err,'지우지'); b.disabled=false; } }
  };
  const amt = root.querySelector('#f_amount');
  amt.oninput = () => { const n = amt.value.replace(/[^\d]/g,''); amt.value = n ? won(Number(n)) : ''; };
  root.querySelector('#f_vin').onchange = () => { readForm(root,f); rerender(); };
  root.querySelector('#f_shop').onchange = () => { readForm(root,f); rerender(); };
  root.querySelector('#jobForm').onsubmit = async e => {
    e.preventDefault(); readForm(root,f);
    if (!S.sb) { toast('저장소에 연결되지 않았어요'); return; }
    if (!f.car.trim() && !joinWork(f)) { toast('차종이나 작업내용을 적어 주세요'); return; }
    const btn = root.querySelector('#f_save'); btn.disabled = true;
    try {
      const d = await saveJob(f);
      toast(`${mode==='edit'?'수정했어요':'저장했어요'} · ${d.car||d.work} ${man(d.amount)}원`);
      done(d);
    } catch(err){ toast('저장하지 못했어요. 다시 시도해 주세요.'); btn.disabled=false; }
  };
}

function viewAdd(){
  const f = S.form;
  const day = S.jobs.filter(j=>j.date===f.date);

  </section>`;
}
function viewBook(){
  const all = monthJobs();
  const q = S.bookQuery.trim().toLowerCase();
  let rows = all;
  if (S.bookFilter==='due') rows = rows.filter(j=>!j.paid && !j.canceled);
  if (S.bookShop) rows = rows.filter(j=>(j.shop||'')===S.bookShop);
  if (q) rows = rows.filter(j=>[j.car,j.vin,j.dealer,j.shop,j.work,j.note].join(' ').toLowerCase().includes(q));
  const due = all.filter(j=>!j.paid && !j.canceled);
  const groups = new Map(); for (const j of rows){ if(!groups.has(j.date)) groups.set(j.date,[]); groups.get(j.date).push(j); }
  const shops = [...new Set(all.map(j=>j.shop||''))].sort();
  return `<section class="view">
    <div class="summary">
      <div><span class="label">작업</span><b>${all.filter(live).length}대</b></div>
      <div><span class="label">합계</span><b>${man(sum(all))}</b></div>
      <div class="due"><span class="label">미입금</span><b>${man(sum(due))}</b></div>
    </div>
    <div class="toolbar">
      <input type="search" id="bq" placeholder="차종, 차대번호, 딜러 검색" value="${esc(S.bookQuery)}" aria-label="검색">
      <select id="bshop" aria-label="작업장" style="width:auto;flex:none;max-width:44%"><option value="">모든 작업장</option>${shops.map(s=>`<option value="${esc(s)}" ${s===S.bookShop?'selected':''}>${esc(s||'작업장 미기재')}</option>`).join('')}</select>
    </div>
    <div class="toolbar">
      <div class="toggle" style="flex:1"><button type="button" data-bf="all" aria-pressed="${S.bookFilter==='all'}">전체</button><button type="button" class="due" data-bf="due" aria-pressed="${S.bookFilter==='due'}">미입금만</button></div>
      <button type="button" class="btn small sec" id="exportBtn">엑셀로 내보내기</button>
    </div>
    ${rows.length ? [...groups.entries()].map(([d,js])=>`
      <div><div class="dayhead"><span>${esc(dayLabel(d))}</span><span class="num">${js.filter(live).length}대 · ${won(sum(js))}</span></div>
      <div class="list">${js.map(jobRow).join('')}</div></div>`).join('')
      : `<div class="list"><div class="empty">${S.loaded?`${S.month}월에 해당하는 작업이 없어요`:'장부를 불러오는 중이에요'}</div></div>`}
  </section>`;
}
function viewDue(){
  const due = S.jobs.filter(j=>!j.paid && !j.canceled);
  const byShop = new Map(); for (const j of due){ const k=j.shop||'작업장 미기재'; if(!byShop.has(k)) byShop.set(k,[]); byShop.get(k).push(j); }
  const shops = [...byShop.entries()].sort((a,b)=>sum(b[1])-sum(a[1]));
  return `<section class="view">
    <div class="card bigdue"><span class="label">${S.year}년 받을 돈</span><b>${won(sum(due))}원</b><span class="hint">${due.length}건 · ${shops.length}곳</span></div>
    ${shops.length? shops.map(([shop,js])=>{
      const open = S.openShop===shop; const sel = S.dueSel[shop]||[];
      const months = [...new Set(js.map(j=>Number(j.date.slice(5,7))))].sort((a,b)=>a-b);
      const selSum = js.filter(j=>sel.includes(j.id)).reduce((a,j)=>a+(j.amount||0),0);
      return `<div class="card shopdue">
        <button type="button" class="hd" data-open="${esc(shop)}" aria-expanded="${open}"><span><b>${esc(shop)}</b><br><span class="hint">${js.length}건 · ${months.map(m=>m+'월').join(', ')}</span></span><span class="num">${won(sum(js))}</span></button>
        ${open?`<div>
          ${[...js].sort((a,b)=>a.date.localeCompare(b.date)).map(j=>`<label class="check"><input type="checkbox" data-pick="${esc(j.id)}" data-shop="${esc(shop)}" ${sel.includes(j.id)?'checked':''}><span class="t"><b>${esc(j.car||j.work)}</b> <span class="mono hint">${esc(j.vin)}</span><br><span class="hint">${esc(j.date.slice(5).replace('-','/'))} · ${esc([j.dealer,j.work].filter(Boolean).join(' · '))}</span></span><span class="num">${won(j.amount)}</span></label>`).join('')}
          ${S.confirm?.shop===shop ? `<div class="confirm"><span>${S.confirm.ids.length}건, ${won(S.confirm.total)}원을 입금 받은 걸로 표시할까요?</span><div class="btnrow"><button type="button" class="btn small sec" data-cno>취소</button><button type="button" class="btn small" data-cyes>입금 처리</button></div></div>`
          : `<div class="btnrow" style="margin-top:10px"><button type="button" class="btn small sec" data-selall="${esc(shop)}">${sel.length===js.length?'선택 해제':'모두 선택'}</button><button type="button" class="btn small" data-pay="${esc(shop)}" ${sel.length?'':'disabled'}>${sel.length?`${sel.length}건 ${man(selSum)}원 입금 처리`:'입금 받은 건을 고르세요'}</button></div>`}
        </div>`:''}
      </div>`;}).join('') : `<div class="list"><div class="empty">${S.loaded?'받을 돈이 없어요. 모두 입금됐어요.':'불러오는 중이에요'}</div></div>`}
  </section>`;
}
function viewStats(){
  const months = Array.from({length:12},(_,i)=>{ const k=`${S.year}-${pad(i+1)}`; const js=S.jobs.filter(j=>j.date.startsWith(k)); return {m:i+1, total:sum(js), n:js.filter(live).length}; });
  const sm = S.month; const js = monthJobs().filter(live);
  const yearTotal = months.reduce((a,x)=>a+x.total,0), yearN = months.reduce((a,x)=>a+x.n,0);
  const max = Math.max(1,...months.map(x=>x.total));
  const W=600,H=190,top=22,bot=28,bw=W/12;
  const bars = months.map((x,i)=>{ const h=Math.round((H-top-bot)*x.total/max); const X=i*bw+bw*.18, Y=H-bot-h;
    return `<rect class="b ${x.m===sm?'sel':''}" x="${X}" y="${Y}" width="${bw*.64}" height="${h}" rx="3"/>
      ${x.total?`<text x="${X+bw*.32}" y="${Y-6}" text-anchor="middle" class="${x.m===sm?'lbl':''}">${Math.round(x.total/10000)}</text>`:''}
      <text x="${X+bw*.32}" y="${H-10}" text-anchor="middle" class="${x.m===sm?'lbl':''}">${x.m}월</text>
      <rect class="hit" data-sm="${x.m}" x="${i*bw}" y="0" width="${bw}" height="${H}"/>`; }).join('');
  const agg = (key, arr, split) => { const m=new Map(); for(const j of arr){ const ks = split? (splitWork(j[key]).length?splitWork(j[key]):['미기재']) : [j[key]||'미기재']; for(const k of ks){ const o=m.get(k)||{n:0,t:0}; o.n++; o.t+= split?0:(j.amount||0); m.set(k,o);} } return [...m.entries()].sort((a,b)=> split? b[1].n-a[1].n : b[1].t-a[1].t); };
  const shopRows = agg('shop', js); const workRows = agg('work', js, true).slice(0,8); const dealerRows = agg('dealer', js).slice(0,6);
  const bar = (rows, val, fmt) => { const mx=Math.max(1,...rows.map(r=>val(r[1]))); return `<div class="bars">${rows.map(([k,o])=>`<div class="bar"><span class="nm">${esc(k)}</span><span class="tr"><i style="width:${Math.max(2,val(o)/mx*100)}%"></i></span><span class="v">${fmt(o)}</span></div>`).join('')||'<div class="hint">작업이 없어요</div>'}</div>`; };
  const avg = js.length ? Math.round(sum(js)/js.length/1000)*1000 : 0;
  return `<section class="view">
    <div class="summary">
      <div><span class="label">${S.year}년 합계</span><b>${man(yearTotal)}</b></div>
      <div><span class="label">${S.year}년 작업</span><b>${yearN}대</b></div>
      <div><span class="label">${sm}월 대당 평균</span><b>${man(avg)}</b></div>
    </div>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px"><h2>월별 매출</h2><span class="hint">만원 · 막대를 누르면 그 달로</span></div>
      <div class="chartwrap"><svg class="months" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px" role="img" aria-label="월별 매출 막대그래프"><line x1="0" x2="${W}" y1="${H-bot}" y2="${H-bot}"/>${bars}</svg></div>
    </div>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px"><h2>${sm}월 작업장별</h2><span class="hint num">${js.length}대 · ${won(sum(js))}원</span></div>${bar(shopRows, o=>o.t, o=>`${man(o.t)} · ${o.n}대`)}</div>
    <div class="card"><h2 style="margin-bottom:12px">${sm}월 작업내용</h2>${bar(workRows, o=>o.n, o=>`${o.n}건`)}</div>
    <div class="card"><h2 style="margin-bottom:12px">${sm}월 딜러별</h2>${bar(dealerRows, o=>o.t, o=>`${man(o.t)} · ${o.n}대`)}</div>
  </section>`;
}

// ---------- render ----------
function render(){
  S.stale = false;
  const main = document.getElementById('main');
  const y = window.scrollY;
  if (!S.sb) { document.getElementById('monthnav').hidden = true; main.innerHTML = `<section class="view"><div class="list"><div class="empty">${S.bootError?esc(S.bootError):'불러오는 중이에요'}</div></div></section>`; return; }
  document.getElementById('mLabel').textContent = `${S.year}년 ${S.month}월`;
  document.getElementById('monthnav').hidden = S.tab==='add';
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===S.tab));
  const dueN = S.jobs.filter(j=>!j.paid && !j.canceled).length; const badge = document.getElementById('dueBadge');
  badge.hidden = !dueN; badge.textContent = dueN;
  if (S.tab==='add'){
    main.innerHTML = viewAdd();
    const root = document.getElementById('addView');
    bindForm(root, S.form, 'add', ()=>{ render(); }, d => { S.form = blankForm({ date:S.form.date, shop:S.form.shop, dealer:S.form.dealer, works:S.form.works, workExtra:S.form.workExtra, amount:S.form.amount, paid:S.form.paid }); render(); });
    // keep typed values across live re-renders
    root.addEventListener('input', ()=>readForm(root, S.form));
  } else if (S.tab==='book') main.innerHTML = viewBook();
  else if (S.tab==='due') main.innerHTML = viewDue();
  else main.innerHTML = viewStats();
  window.scrollTo(0,y);
}
function openEdit(id){
  const j = S.jobs.find(x=>x.id===id); if (!j) return;
  const parts = splitWork(j.work); const works = parts.filter(p=>WORKS.includes(p)); const extra = parts.filter(p=>!WORKS.includes(p)).join(', ');
  const f = { id:j.id, date:j.date, shop:j.shop||'', dealer:j.dealer||'', car:j.car||'', vin:j.vin||'', works, workExtra:extra, amount:String(j.amount||''), paid:!!j.paid, canceled:!!j.canceled, note:j.note||'' };
  const bg = document.createElement('div'); bg.className='sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-label="작업 수정"><div class="hd"><h2>작업 수정</h2><button type="button" class="x" aria-label="닫기">×</button></div><div id="editBody"></div>${j.src?`<p class="hint">${esc(j.src)}에서 옮겨 온 기록이에요</p>`:''}</div>`;
  document.body.appendChild(bg); document.body.style.overflow='hidden';
  const close = () => { bg.remove(); document.body.style.overflow=''; };
  bg.addEventListener('click', e=>{ if(e.target===bg || e.target.closest('.x')) close(); });
  const body = bg.querySelector('#editBody');
  const draw = () => { body.innerHTML = formHTML(f,'edit'); bindForm(body, f, 'edit', draw, close); };
  draw();
}

// ---------- events ----------
document.querySelector('nav.tabs').onclick = e => { const b=e.target.closest('button'); if(!b) return; S.tab=b.dataset.tab; S.confirm=null; try{localStorage.setItem('cn.tab',S.tab);}catch(err){} render(); window.scrollTo(0,0); };
function shiftMonth(d){ let m=S.month+d, y=S.year; if(m<1){m=12;y--;} if(m>12){m=1;y++;} S.month=m; if(y!==S.year){ S.year=y; S.jobs=[]; load(); } render(); }
document.getElementById('mPrev').onclick = ()=>shiftMonth(-1);
document.getElementById('mNext').onclick = ()=>shiftMonth(1);
document.getElementById('main').addEventListener('click', async e => {
  const ed = e.target.closest('[data-edit]'); if (ed){ openEdit(ed.dataset.edit); return; }
  const bf = e.target.closest('[data-bf]'); if (bf){ S.bookFilter = bf.dataset.bf; render(); return; }
  const sm = e.target.closest('[data-sm]'); if (sm){ S.month = Number(sm.dataset.sm); render(); return; }
  if (e.target.closest('#exportBtn')) { exportXlsx(); return; }
  const op = e.target.closest('[data-open]'); if (op){ S.openShop = S.openShop===op.dataset.open?null:op.dataset.open; S.confirm=null; render(); return; }
  const sa = e.target.closest('[data-selall]'); if (sa){ const shop=sa.dataset.selall; const ids=S.jobs.filter(j=>!j.paid&&!j.canceled&&(j.shop||'작업장 미기재')===shop).map(j=>j.id); S.dueSel[shop] = (S.dueSel[shop]||[]).length===ids.length?[]:ids; render(); return; }
  const pay = e.target.closest('[data-pay]'); if (pay){ const shop=pay.dataset.pay; const ids=S.dueSel[shop]||[]; S.confirm={shop, ids, total:S.jobs.filter(j=>ids.includes(j.id)).reduce((a,j)=>a+(j.amount||0),0)}; render(); return; }
  if (e.target.closest('[data-cno]')){ S.confirm=null; render(); return; }
  const cy = e.target.closest('[data-cyes]'); if (cy){ const c=S.confirm; cy.disabled=true; cy.textContent='처리 중…'; const ok = await setPaid(c.ids,true); if(ok){ toast(`${c.ids.length}건 입금 처리했어요 · ${man(c.total)}원`); S.dueSel[c.shop]=[]; } S.confirm=null; render(); return; }
});
document.getElementById('main').addEventListener('change', e => {
  if (e.target.matches('[data-pick]')){ const shop=e.target.dataset.shop, id=e.target.dataset.pick; const s=new Set(S.dueSel[shop]||[]); e.target.checked?s.add(id):s.delete(id); S.dueSel[shop]=[...s]; render(); }
  if (e.target.id==='bshop'){ S.bookShop=e.target.value; render(); }
});
document.getElementById('main').addEventListener('focusout', () => setTimeout(() => {
  if (S.stale && !document.activeElement?.matches('#main input, #main textarea, #main select')) render();
}, 0));
let qT; document.getElementById('main').addEventListener('input', e => {
  if (e.target.id==='bq'){ S.bookQuery=e.target.value; clearTimeout(qT); qT=setTimeout(()=>{ render(); const i=document.getElementById('bq'); i.focus(); i.setSelectionRange(i.value.length,i.value.length); },250); }
});

// ---------- export ----------
function loadXLSX(){ return window.XLSX ? Promise.resolve() : new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function exportXlsx(){
  try { await loadXLSX(); } catch(e){ toast('엑셀 도구를 불러오지 못했어요'); return; }
  const head = ['작업일','입금','작업장','담당 딜러','차종','차대번호','작업내용','금액','메모'];
  const toRow = j => [j.date, j.canceled?'취소':(j.paid?'○':''), j.shop, j.dealer, j.car, j.vin, j.work, j.canceled?0:j.amount, j.note];
  const wb = XLSX.utils.book_new();
  for (let m=1;m<=12;m++){
    const js = S.jobs.filter(j=>j.date.startsWith(`${S.year}-${pad(m)}`)).sort((a,b)=>a.date.localeCompare(b.date));
    if (!js.length) continue;
    const ws = XLSX.utils.aoa_to_sheet([head, ...js.map(toRow), [], ['합계','','','','',`${js.filter(live).length}대`,'',sum(js)]]);
    ws['!cols'] = [{wch:11},{wch:5},{wch:14},{wch:10},{wch:12},{wch:10},{wch:26},{wch:10},{wch:30}];
    XLSX.utils.book_append_sheet(wb, ws, `${m}월`);
  }
  const due = S.jobs.filter(j=>!j.paid&&!j.canceled).sort((a,b)=>(a.shop||'').localeCompare(b.shop||'')||a.date.localeCompare(b.date));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([head, ...due.map(toRow), [], ['합계','','','','','','',sum(due)]]), '미입금');
  const buf = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  a.download = `필름웍스_${S.year}.xlsx`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  toast('엑셀 파일을 저장했어요');
}

  if (!window.supabase) { S.bootError = '저장소 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.'; setSync('연결 끊김'); render(); return; }
  S.sb = supabase.createClient(SB_URL, SB_KEY, { db: { schema: 'filmworks' } });
  render();
  load();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
})();
})();
